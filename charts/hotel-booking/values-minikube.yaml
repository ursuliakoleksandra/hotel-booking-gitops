# Значення для кластера minikube під керуванням Argo CD.
# Secret створюється вручну (див. README), у Git паролів немає.
existingSecret: hotel-booking-secret

# Argo CD запускає Helm-хуки pre-upgrade як PreSync ще до створення об'єктів,
# а helm test не потрібен, тож вимикаємо обидва.
hooks:
  enabled: false
tests:
  enabled: false

image:
  tag: "2.0.0"                # Spring-сервіси з метриками та JSON-логами
  pullPolicy: IfNotPresent    # образи завантажені в minikube

config:
  APP_ENV: "minikube"

# Метрики, дашборд і алерт потребують CRD kube-prometheus-stack (ServiceMonitor, PrometheusRule).
# Спершу false; після того як kps став Healthy, окремим комітом міняємо обидва на true.
metrics:
  enabled: true
  alerts:
    enabled: true

# Автоматичний відкат за метриками (ЛР-7): аналізуємо частку не-5xx відповідей hotel-management
analysis:
  enabled: true
  prometheusAddress: http://kps-prometheus.monitoring:9090
  threshold: 0.95
  selector: 'namespace="{{ .Release.Namespace }}",service="{{ include "hotel-booking.componentName" (dict "root" . "component" "hotel-management") }}"'

services:
  hotel-management:
    replicas: 4               # canary: 25% = 1 под із 4
    image:
      tag: "2.1.0"            # саме цей тег міняємо для релізу
    env:
      - name: FAIL_RATE       # частка запитів, що отримують 500 (поганий реліз: "0.5")
        value: "0.5"
    rollout:
      enabled: true
      strategy:
        canary:
          steps:
            - setWeight: 25
            - pause: {duration: 30s}       # дати метрикам накопичитися
            - analysis:
                templates:
                  - templateName: '{{ include "hotel-booking.fullname" . }}-success-rate'
            - setWeight: 50
            - pause: {duration: 30s}

# UI з ЛР-6 лишається звичайним Deployment, щоб не перевантажувати кластер
ui:
  replicas: 1
  image:
    tag: "1.1.0"
  progressDeadlineSeconds: 90
  rollout:
    enabled: false

ingress:
  enabled: false
