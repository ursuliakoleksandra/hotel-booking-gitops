{{- if and .Values.metrics.enabled .Values.metrics.alerts.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "hotel-booking.fullname" . }}-alerts
  labels:
    {{- include "hotel-booking.labels" (dict "root" . "component" "metrics") | nindent 4 }}
spec:
  groups:
    - name: hotel-booking
      rules:
        - alert: HotelBookingHighErrorRate
          expr: |
            sum(rate(http_server_requests_seconds_count{namespace="{{ .Release.Namespace }}",status=~"5..",uri!~"/actuator.*"}[1m]))
            / sum(rate(http_server_requests_seconds_count{namespace="{{ .Release.Namespace }}",uri!~"/actuator.*"}[1m])) > 0.05
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "hotel-booking: більше 5% відповідей 5xx"
{{- end }}
