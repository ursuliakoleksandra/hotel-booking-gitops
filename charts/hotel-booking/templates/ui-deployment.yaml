{{- if not .Values.ui.rollout.enabled }}
{{- $ui := include "hotel-booking.componentName" (dict "root" . "component" "ui") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $ui }}
  labels:
    {{- include "hotel-booking.labels" (dict "root" . "component" "ui") | nindent 4 }}
spec:
  replicas: {{ .Values.ui.replicas }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  progressDeadlineSeconds: {{ .Values.ui.progressDeadlineSeconds }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "hotel-booking.selectorLabels" (dict "root" . "component" "ui") | nindent 6 }}
  template:
    {{- include "hotel-booking.ui.podTemplate" . | nindent 4 }}
{{- end }}
