{{- if and .Values.ui.rollout.enabled .Values.ui.rollout.strategy.blueGreen }}
{{- $ui := include "hotel-booking.componentName" (dict "root" . "component" "ui") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $ui }}-preview
  labels:
    {{- include "hotel-booking.labels" (dict "root" . "component" "ui") | nindent 4 }}
spec:
  type: {{ .Values.ui.service.type }}
  selector:
    {{- include "hotel-booking.selectorLabels" (dict "root" . "component" "ui") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.ui.service.port }}
      targetPort: http
{{- end }}
