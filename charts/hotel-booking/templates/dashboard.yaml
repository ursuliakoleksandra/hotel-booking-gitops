{{- if .Values.metrics.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hotel-booking.fullname" . }}-dashboard
  labels:
    grafana_dashboard: "1"
    {{- include "hotel-booking.labels" (dict "root" . "component" "dashboard") | nindent 4 }}
data:
  hotel-booking.json: |-
{{ .Files.Get "dashboards/hotel-booking.json" | indent 4 }}
{{- end }}
