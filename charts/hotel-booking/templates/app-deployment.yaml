{{- range $name, $svc := .Values.services }}
{{- if not $svc.rollout.enabled }}
{{- $comp := include "hotel-booking.componentName" (dict "root" $ "component" $name) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $comp }}
  labels:
    {{- include "hotel-booking.labels" (dict "root" $ "component" $name) | nindent 4 }}
spec:
  replicas: {{ $svc.replicas }}
  revisionHistoryLimit: {{ $.Values.revisionHistoryLimit }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "hotel-booking.selectorLabels" (dict "root" $ "component" $name) | nindent 6 }}
  template:
    {{- include "hotel-booking.app.podTemplate" (dict "root" $ "name" $name "svc" $svc) | nindent 4 }}
{{- end }}
{{- end }}
