apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hotel-booking
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ursuliakoleksandra/hotel-booking-gitops.git
    targetRevision: main
    path: charts/hotel-booking
    helm:
      valueFiles:
        - values-minikube.yaml   # шлях відносно каталогу чарту
  destination:
    server: https://kubernetes.default.svc
    namespace: hotel-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:                       # якщо застосунок прийшов раніше за CRD Argo Rollouts
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
  # Тільки для blue-green: контролер дописує мітку в селектор Service, Argo CD має це ігнорувати.
  # ignoreDifferences:
  #   - kind: Service
  #     jsonPointers:
  #       - /spec/selector
